<!doctype html>
<html lang="en" data-palette="{{PALETTE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathematical graph</title>
<style id="simulation-style">{{SIMULATION_STYLE}}</style>
<style>
.sim-panes{align-items:stretch}
button,.sim-footer{font-size:14px}
.graph-result{display:flex;flex-direction:column;min-height:0}
.graph-result h2,.graph-legend,.graph-result .axis-note,.graph-result .readout{flex-shrink:0}
.graph-result h2{margin-bottom:10px}
.graph-legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:0 0 10px;font-size:14px}
.graph-legend span{display:inline-flex;align-items:center;gap:5px}
.graph-legend svg{width:22px;height:10px;max-height:none;border:0;background:transparent}
.graph-area{position:relative;flex:1;min-height:230px;width:100%;border:1px solid var(--line);border-radius:3px;touch-action:none}
.graph-area svg{display:block;width:100%;height:100%;max-width:none;max-height:none;border:0;background:transparent}
.JXGtext{position:absolute;white-space:nowrap;font-family:var(--mono);background:transparent;padding:0;margin:0}
.JXGinfobox{border:0;background:var(--surface)}
.graph-result .axis-note{margin:8px 0 0}
.graph-result .readout{display:block;margin:12px 0 0;min-height:4.5em}
.graph-controls .eq{margin:0 0 12px;padding:0;min-height:1.5em}
.graph-controls label{display:flex;justify-content:space-between;gap:12px}
.graph-controls .actions{margin-top:16px}
.sim-footer{overflow-wrap:anywhere}
@media(max-width:999px){.graph-area{min-height:240px}.graph-result .readout{min-height:4em}}
@media(max-width:400px){.graph-area{min-height:210px}.sim-nav button{padding-inline:10px}}
</style>
</head>
<body>
<main class="sim-shell" aria-label="Mathematical graph experiment">
<header class="sim-header"><h1 id="graph-title">Mathematical graph</h1><p id="graph-question"></p></header>
<nav class="sim-nav" aria-label="Choose experiment view">
<button type="button" data-view="both" aria-pressed="true">Together</button>
<button type="button" data-view="controls" aria-pressed="false">Controls</button>
<button type="button" data-view="result" aria-pressed="false">Result</button>
<button type="button" data-view="model" aria-pressed="false">Model</button>
</nav>
<div class="sim-panes" data-view="both">
<section class="sim-pane graph-controls" data-pane="controls" aria-label="Controls">
<h2 id="controls-title">Change one condition</h2><p id="graph-equation" class="eq"></p>
<div id="graph-controls"></div><div class="actions"><button id="reset" type="button">Reset</button></div>
<p id="control-note" class="hint"></p>
</section>
<section class="sim-pane graph-result" data-pane="result" aria-label="Result">
<h2 id="result-title">Inspect the relationship</h2>
<div id="graph-legend" class="graph-legend" aria-label="Curve legend" hidden></div>
<div id="graph-board" class="graph-area" role="img" aria-label="Mathematical graph"></div>
<p id="axis-note" class="axis-note"></p><p id="graph-readout" class="readout" aria-live="polite"></p>
</section>
<section class="sim-pane" data-pane="model" aria-label="Model" hidden><h2>What the model assumes</h2><p id="graph-model"></p></section>
</div>
<footer id="graph-task" class="sim-footer"></footer>
</main>
<script>{{JSXGRAPH_RUNTIME}}</script>
<script>{{SHELL_SCRIPT}}</script>
<script>{{GRAPH_SCRIPT}}</script>
<script>{{SCENE_SCRIPT}}</script>
</body>
</html>
